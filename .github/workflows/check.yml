# The check that was only ever run by remembering to run it.
#
# `npm run check` is typecheck, lint and the suite. One of those tests exists to
# catch a mistake nobody would see by reading a diff: `tests/no-em-dash.test.ts`.
# A house rule enforced only by habit lasts until the first hurried afternoon.
name: check

on:
  push:
    branches: ['**']
  pull_request:
  # So a dependency that goes bad on a quiet week is found on the quiet week
  # rather than on the day of a release.
  schedule:
    - cron: '0 6 * * 1'

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The version this plugin is developed against. Pinned to the major so
          # a patch release is picked up and a major is a decision.
          node-version: '22'
          cache: npm

      # `ci` rather than `install`: it installs exactly what package-lock.json
      # says and fails if the lockfile and the manifest disagree, which is the
      # one thing a local `npm install` will silently fix for you.
      - run: npm ci

      - run: npm run check

      # After the check, not before: a bundling error should be reported as a
      # bundling error rather than hidden behind a failing test. The bundle is
      # what ships and nothing else proves esbuild can produce one.
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    # Reported, never blocking. A high-severity advisory in a lint-time
    # dependency is worth knowing about and is not a reason to stop a release.
    # A gate that cries wolf gets switched off, and then the real one is missed
    # too.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
